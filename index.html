    <script>
    (function() {
        
        function formatNumber(num) {
            if (num === undefined || num === null) return '0';
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }
        
        function formatReputation(rep) {
            if (rep === undefined || rep === null) return { text: '0', class: '' };
            if (rep > 0) return { text: '+' + rep, class: 'positive' };
            if (rep < 0) return { text: rep.toString(), class: 'negative' };
            return { text: '0', class: '' };
        }
        
        function getPiskaRank(tops) {
            if (!tops) tops = 100;
            if (tops > 500) return 'Рядовой писечник';
            if (tops > 200) return 'Неопытный писечник';
            if (tops > 100) return 'Опытный писечник';
            if (tops > 50) return 'Ветеран писечников';
            if (tops > 20) return 'Легендарный писечник';
            if (tops > 10) return 'Писечник-перфекционист';
            if (tops > 5) return 'Эксклюзивный писечник';
            if (tops > 1) return 'Непревзойденный писечник';
            if (tops === 1) return 'Король писечников';
            return 'Рядовой писечник';
        }
        
        function renderProfile(profile) {
            
            try {
                document.getElementById('userName').textContent = profile.nickname || `Пользователь ${profile.id}`;
                document.getElementById('userIdSpan').textContent = profile.id || '?';
                
                const profileLink = document.getElementById('profileLink');
                profileLink.href = `https://vk.com/id${profile.id}`;
                
                const badges = [];
                const now = Date.now();
                
                if (profile.moderator_level === 1) badges.push({ text: '👺 МОДЕРАТОР-СТАЖЁР', class: 'moder' });
                if (profile.moderator_level === 2) badges.push({ text: '👺 МЛ. МОДЕРАТОР', class: 'moder' });
                if (profile.moderator_level === 3) badges.push({ text: '👺 МОДЕРАТОР', class: 'moder' });
                if (profile.moderator_level === 4) badges.push({ text: '👺 СТ. МОДЕРАТОР', class: 'moder' });
                if (profile.moderator_level === 5) badges.push({ text: '👹 АДМИНИСТРАТОР', class: 'admin' });
                if (profile.moderator_level === 6) badges.push({ text: '👹 СТ. АДМИНИСТРАТОР', class: 'admin' });
                
                if (profile.premium_until && profile.premium_until * 1000 > now) {
                    badges.push({ text: '💎 PREMIUM', class: 'premium' });
                }
                
                if (profile.vampire_until && profile.vampire_until * 1000 > now) {
                    badges.push({ text: '🧛‍♂ ВАМПИР', class: 'vampire' });
                }
                
                if (profile.creator) {
                    badges.push({ text: '🎨 CREATOR', class: 'creator' });
                }
                
                if (profile.admin_dev) {
                    badges.push({ text: '👨‍💻 РАЗРАБОТЧИК', class: 'dev' });
                }
                
                if (profile.president) {
                    badges.push({ text: '🔞 ПРЕЗИДЕНТ', class: 'president' });
                }
                
                const badgesContainer = document.getElementById('badgesContainer');
                if (badges.length > 0) {
                    badgesContainer.innerHTML = badges.map(b => 
                        `<span class="badge ${b.class}">${b.text}</span>`
                    ).join('');
                } else {
                    badgesContainer.innerHTML = '';
                }
                
                const formattedBalance = formatNumber(profile.balance);
                const repFormatted = formatReputation(profile.reputation);
                const piskaRank = getPiskaRank(profile.piska_rank);
                const expProgress = profile.exp ? (profile.exp / 100) * 100 : 0;
                
                let infoHtml = `
                    <div class="info-row">
                        <span class="info-label">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#6a11cb">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                            </svg>
                            💸 Баланс
                        </span>
                        <span class="info-value balance">${formattedBalance}$</span>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#6a11cb">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                            </svg>
                            🍌 Писька
                        </span>
                        <span class="info-value">${profile.piska || 0} см (${piskaRank})</span>
                    </div>
                    
                    <div class="info-row" style="flex-direction: column; align-items: stretch; gap: 8px;">
                        <div style="display: flex; justify-content: space-between; width: 100%;">
                            <span class="info-label">📊 Уровень ${profile.level || 1}</span>
                            <span class="info-value">${profile.exp || 0}/100 XP</span>
                        </div>
                        <div class="progress-bar" style="margin: 0;">
                            <div class="progress-fill" style="width: ${expProgress}%;"></div>
                        </div>
                    </div>
                    
                    <div class="info-row">
                        <span class="info-label">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#6a11cb">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                            </svg>
                            😘 Репутация
                        </span>
                        <span class="info-value reputation ${repFormatted.class}">${repFormatted.text}</span>
                    </div>
                `;
                
                if (profile.clan) {
                    const clanRoles = ['Участник', 'Старейшина', 'Админ', 'Владелец'];
                    const role = clanRoles[profile.clan_role] || 'Участник';
                    infoHtml += `
                        <div class="info-row">
                            <span class="info-label">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="#6a11cb">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                                </svg>
                                👾 Клан
                            </span>
                            <span class="info-value">"${profile.clan}" (${role})</span>
                        </div>
                    `;
                }
                
                if (profile.family) {
                    infoHtml += `
                        <div class="info-row">
                            <span class="info-label">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="#6a11cb">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                                </svg>
                                👨‍👩‍👦 Семья
                            </span>
                            <span class="info-value">${profile.family}</span>
                        </div>
                    `;
                }
                
                if (profile.married && profile.spouse) {
                    infoHtml += `
                        <div class="info-row">
                            <span class="info-label">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="#6a11cb">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                                </svg>
                                💍 В браке
                            </span>
                            <span class="info-value">
                                с <a href="/profile/${profile.spouse.id}" class="spouse-link">${profile.spouse.nickname}</a>
                            </span>
                        </div>
                    `;
                }
                
                let extraHtml = '';
                
                if (profile.business_id && profile.business_id != 0) {
                    extraHtml += `
                        <div class="extra-item">
                            <div class="extra-icon">🏭</div>
                            <div class="extra-text">
                                <div class="extra-title">Бизнес</div>
                                <div class="extra-value">${profile.business_name}</div>
                            </div>
                        </div>
                    `;
                }
                
                if (profile.pet_id && profile.pet_id != 0) {
                    extraHtml += `
                        <div class="extra-item">
                            <div class="extra-icon">🐶</div>
                            <div class="extra-text">
                                <div class="extra-title">Питомец</div>
                                <div class="extra-value">${profile.pet_name}</div>
                            </div>
                        </div>
                    `;
                }
                
                if (profile.phone_id && profile.phone_id != 0) {
                    extraHtml += `
                        <div class="extra-item">
                            <div class="extra-icon">📱</div>
                            <div class="extra-text">
                                <div class="extra-title">Телефон</div>
                                <div class="extra-value">${profile.phone_name}</div>
                            </div>
                        </div>
                    `;
                }
                
                if (profile.register_date && profile.register_date !== "Неизвестно") {
                    extraHtml += `
                        <div class="extra-item">
                            <div class="extra-icon">📅</div>
                            <div class="extra-text">
                                <div class="extra-title">Дата регистрации</div>
                                <div class="extra-value">${profile.register_date}</div>
                            </div>
                        </div>
                    `;
                }
                
                const finalHtml = infoHtml + (extraHtml ? '<div class="extra-info">' + extraHtml + '</div>' : '') + (profile.scam ? `
                    <div class="warning">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="#ef9a9a">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                        Данный юзер попадался за обман! Будьте осторожны!
                    </div>
                ` : '');
                
                document.getElementById('profileInfo').innerHTML = finalHtml;
                
                if (profile.photo_url) {
                    document.getElementById('profilePhoto').src = profile.photo_url;
                    document.getElementById('photoSection').style.display = 'block';
                }
                
                
            } catch (error) {
                console.error('Render error:', error);
                document.getElementById('profileInfo').innerHTML = `
                    <div style="color: red; padding: 20px; text-align: center;">
                        Ошибка отображения: ${error.message}
                    </div>
                `;
            }
        }
        
        if (window.profileData) {
            
            if (window.profileData.error) {
                document.getElementById('profileInfo').innerHTML = `
                    <div style="color: red; padding: 20px; text-align: center;">
                        ${window.profileData.error}
                    </div>
                `;
            } else {
                renderProfile(window.profileData);
            }
        } else {
            
            const pathParts = window.location.pathname.split('/');
            const userId = pathParts[pathParts.length - 1];
            
            if (userId && !isNaN(userId)) {
                fetch(`/api/profile/${userId}`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.error) {
                            document.getElementById('profileInfo').innerHTML = `
                                <div style="color: red; padding: 20px; text-align: center;">
                                    ${data.error}
                                </div>
                            `;
                        } else {
                            renderProfile(data);
                        }
                    })
                    .catch(error => {
                        console.error('Fetch error:', error);
                        document.getElementById('profileInfo').innerHTML = `
                            <div style="color: red; padding: 20px; text-align: center;">
                                Ошибка загрузки: ${error.message}
                            </div>
                        `;
                    });
            }
        }
    })();
</script>
<script>
// Проверка авторизации и владельца профиля
document.addEventListener('DOMContentLoaded', async function() {
    const logoutButtonContainer = document.getElementById('logoutButtonContainer');
    const logoutBtn = document.getElementById('logoutBtn');
    
    if (!logoutButtonContainer || !logoutBtn) return;
    
    try {
        // Получаем ID профиля из URL
        const pathParts = window.location.pathname.split('/');
        const profileId = parseInt(pathParts[pathParts.length - 1]);
        
        // Проверяем текущую сессию
        const sessionResponse = await fetch('/api/check-session');
        const sessionData = await sessionResponse.json();
        
        // Показываем кнопку выхода только если:
        // 1. Пользователь авторизован (authenticated === true)
        // 2. ID из сессии совпадает с ID просматриваемого профиля
        if (sessionData.authenticated && sessionData.user_id === profileId) {
            logoutButtonContainer.style.display = 'block';
        } else {
            logoutButtonContainer.style.display = 'none';
        }
        
        // Обработчик выхода
        logoutBtn.addEventListener('click', async function() {
            try {
                const response = await fetch('/api/logout', {
                    method: 'POST'
                });
                
                if (response.ok) {
                    // Перенаправляем на главную после выхода
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        });
        
    } catch (error) {
        console.error('Session check error:', error);
        logoutButtonContainer.style.display = 'none';
    }
});
</script>
<script>
// Дополнительный код для кнопки рулетки
document.addEventListener('DOMContentLoaded', function() {
    // Получаем ID из URL или из window.profileData
    const pathParts = window.location.pathname.split('/');
    const profileId = pathParts[pathParts.length - 1];
    
    // Устанавливаем ссылку для кнопки рулетки
    const rouletteBtn = document.getElementById('rouletteBtn');
    if (rouletteBtn && profileId && !isNaN(profileId)) {
        rouletteBtn.href = `/roulette/${profileId}`;
    }
    
    // Альтернативный вариант: если есть window.profileData
    if (window.profileData && window.profileData.id) {
        rouletteBtn.href = `/roulette/${window.profileData.id}`;
    }
});
</script>
</body>
</html>
